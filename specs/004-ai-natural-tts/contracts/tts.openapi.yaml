openapi: 3.1.0
info:
  title: Storybook-AI Narration (TTS de IA)
  version: 1.0.0
  description: >
    Endpoint server-only que entrega o áudio narrado de uma cena por TTS de IA
    (ativo apenas quando `AI_NARRATION_ENABLED=true`; sem fallback para a voz de
    sistema). Preserva o contrato anônimo: recebe apenas o texto anônimo da cena
    + idioma; nunca um identificador. Zero persistência: a resposta é áudio
    transitório e a rota responde no-store. Se o provedor falhar, a rota
    responde erro (502/429) — o cliente NÃO cai para Web Speech.
servers:
  - url: /api
paths:
  /narrate:
    post:
      operationId: narrateScene
      summary: Gera o áudio narrado de uma cena por TTS de IA
      description: >
        Retorna os bytes de áudio (ex. MP3) da narração do texto da cena no
        idioma ativo. É a única entrada de narração por IA e fica atrás do
        adapter server-only; a chave/provedor de TTS nunca é exposta ao cliente.
        Se a IA estiver indisponível ou o provedor falhar, responde erro
        (502/429) — sem fallback para a Web Speech local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarrateRequest"
      responses:
        "200":
          description: Áudio narrado (transitório). Content-Type do áudio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
              description: Áudio MP3 resultante da narração da cena.
        "204":
          description: Sem conteúdo — IA desativada (`AI_NARRATION_ENABLED=false`); o cliente não deve chamar `/narrate` neste caso (usa voz de sistema diretamente no navegador).
        "400":
          description: Requisição inválida (texto vazio, idioma não suportado ou excede teto de caracteres).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit do provedor de TTS (ex.: limite de requisições atingido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provedor de TTS indisponível ou erro de upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    NarrateRequest:
      type: object
      additionalProperties: false
      required: [sceneText, locale]
      properties:
        sceneText:
          type: string
          description: Texto anônimo da cena (sem nome/idade exata/id). Limite do schema (constante de validação, maxLength=2000).
          minLength: 1
          maxLength: 2000
        locale:
          type: string
          enum: [pt-BR, en]
          description: Idioma ativo da história (mesmo vocabulário do resto do app).
    Error:
      type: object
      required: [code, messageKey, retryable]
      properties:
        code:
          type: string
        messageKey:
          type: string
          description: Chave do catálogo next-intl (nunca texto fixo no servidor).
        retryable:
          type: boolean
  securitySchemes: {}
tags:
  - name: narration
    description: Narração por voz (TTS de IA, server-only, controlado por `AI_NARRATION_ENABLED`; sem fallback para Web Speech).
