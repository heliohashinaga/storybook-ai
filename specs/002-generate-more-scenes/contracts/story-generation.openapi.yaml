openapi: 3.1.0
info:
  title: Storybook AI Story Generation API
  version: 1.1.0
  description: |
    Generates a non-persistent, safety-approved story for the active browser session. The contract
    deliberately accepts no child name, other direct identifier, or exact age. The browser derives
    ageBand locally and sends only age band, locale, an allow-listed theme, and an anonymous
    integer scene count (3, 4, or 5).

    **Feature 002 delta**: the request gains an optional `sceneCount` (default `3`); a response now
    carries 3–5 scenes (a story is only a success when all requested scenes are complete). Existing
    v1 clients that omit `sceneCount` keep the exact prior behavior (3 scenes).
servers:
  - url: /api
paths:
  /stories:
    post:
      operationId: generateStory
      tags: [Story generation]
      summary: Generate a safe 3–5 scene story with illustrations
      description: |
        Validates an allow-listed locale, age band, theme, and scene count; generates and moderates
        a story; regenerates one time if the first candidate is unsafe; then returns only the
        approved story and its optimized scene illustrations. The response must not be cached or
        logged with request content. Generation keeps a single end-to-end budget ceiling (≤120 s)
        for every scene count; per-count timeout parametrization is deferred pending real measurement
        (FR-008). A story is returned only when every requested scene is complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateStoryRequest'
            examples:
              portugueseCourage3:
                summary: Default request (3 scenes)
                value:
                  ageBand: 5-7
                  locale: pt-BR
                  theme: courage
              portugueseCourage5:
                summary: Longer story (5 scenes)
                value:
                  ageBand: 5-7
                  locale: pt-BR
                  theme: courage
                  sceneCount: 5
      responses:
        '200':
          description: Safety-approved story generated successfully.
          headers:
            Cache-Control:
              description: Prevents intermediary/browser persistence of the anonymous story response.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedStory'
              examples:
                portugueseStory:
                  summary: Safe Portuguese story (here 5 scenes) with no child identifier.
                  value:
                    locale: pt-BR
                    ageBand: 5-7
                    theme: courage
                    sceneCount: 5
                    safetyDecision: approved
                    title: 'A pequena aventura na ponte'
                    scenes:
                      - ordinal: 1
                        title: 'Um novo começo'
                        body: 'Uma criança encontrou uma ponte pequena no parque e respirou fundo.'
                        illustrationDataUri: 'data:image/webp;base64,UklGRlIAAABXRUJQVlA4...'
                        altText: 'Uma criança diante de uma pequena ponte em um parque ensolarado.'
                      - ordinal: 2
                        title: 'Um passo de cada vez'
                        body: 'Com cuidado e coragem, a criança atravessou a ponte com um sorriso.'
                        illustrationDataUri: 'data:image/webp;base64,UklGRlIAAABXRUJQVlA4...'
                        altText: 'Uma criança atravessando uma ponte com confiança.'
                      - ordinal: 3
                        title: 'Coragem compartilhada'
                        body: 'A criança voltou para contar aos amigos que coragem cresce a cada passo.'
                        illustrationDataUri: 'data:image/webp;base64,UklGRlIAAABXRUJQVlA4...'
                        altText: 'Crianças sorrindo juntas em um parque.'
                      - ordinal: 4
                        title: 'Um novo desafio'
                        body: 'No dia seguinte, a criança encontrou uma trilha mais longa e sorriu.'
                        illustrationDataUri: 'data:image/webp;base64,UklGRlIAAABXRUJQVlA4...'
                        altText: 'A criança observa uma trilha no meio da floresta.'
                      - ordinal: 5
                        title: 'Coragem que vira hábito'
                        body: 'A criança percebeu que todo desafio fica menor quando começamos.'
                        illustrationDataUri: 'data:image/webp;base64,UklGRlIAAABXRUJQVlA4...'
                        altText: 'A criança caminha com confiança pela trilha.'
        '400':
          description: The request does not match the allow-listed input contract (e.g. sceneCount outside 3–5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                code: invalid_input
                messageKey: story.error.invalidInput
                retryable: false
        '422':
          description: No safe story could be produced after the bounded automatic regeneration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                code: unsafe_unrecoverable
                messageKey: story.error.safeAlternativeUnavailable
                retryable: true
        '429':
          description: The anonymous request limit has been reached.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                code: rate_limited
                messageKey: story.error.tryAgainLater
                retryable: true
        '502':
          description: A required generation provider did not return a valid result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                code: generation_unavailable
                messageKey: story.error.generationUnavailable
                retryable: true
        '504':
          description: Generation did not complete within the request time budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationError'
              example:
                code: generation_timeout
                messageKey: story.error.generationTimeout
                retryable: true
components:
  schemas:
    GenerateStoryRequest:
      type: object
      additionalProperties: false
      required: [ageBand, locale, theme]
      properties:
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        locale:
          $ref: '#/components/schemas/Locale'
        theme:
          $ref: '#/components/schemas/Theme'
        sceneCount:
          $ref: '#/components/schemas/SceneCount'
      description: |
        Contains no child name, direct identifier, or exact age. Clients derive ageBand locally.
        `sceneCount` is optional and defaults to 3 (v1 behavior). Unknown fields, including name,
        are rejected.
    GeneratedStory:
      type: object
      additionalProperties: false
      required: [locale, ageBand, theme, sceneCount, safetyDecision, title, scenes]
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        theme:
          $ref: '#/components/schemas/Theme'
        sceneCount:
          $ref: '#/components/schemas/SceneCount'
        safetyDecision:
          type: string
          enum: [approved, regenerated]
          description: No unsafe candidate content is included in this response.
        title:
          type: string
          minLength: 1
          maxLength: 140
          description: Localized plain text without template markers or identifiers.
        scenes:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: '#/components/schemas/GeneratedScene'
    GeneratedScene:
      type: object
      additionalProperties: false
      required: [ordinal, title, body, illustrationDataUri, altText]
      properties:
        ordinal:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          minLength: 1
          maxLength: 100
        body:
          type: string
          minLength: 1
          maxLength: 1600
          description: Localized plain text without template markers or identifiers.
        illustrationDataUri:
          type: string
          pattern: '^data:image/webp;base64,'
          description: Optimized, session-only scene illustration. It is not an object-store URL.
        altText:
          type: string
          minLength: 1
          maxLength: 300
          description: Localized, age-appropriate illustration description.
    SceneCount:
      type: integer
      minimum: 3
      maximum: 5
      default: 3
      description: Anonymous requested scene count. Defaults to 3 (v1). Values outside 3–5 are rejected.
    AgeBand:
      type: string
      enum: ['2-4', '5-7', '8-9']
    Locale:
      type: string
      enum: [pt-BR, en]
    Theme:
      type: string
      enum: [courage, friendship, kindness]
    GenerationError:
      type: object
      additionalProperties: false
      required: [code, messageKey, retryable]
      properties:
        code:
          type: string
          enum:
            - invalid_input
            - unsupported_locale
            - unsafe_unrecoverable
            - rate_limited
            - generation_unavailable
            - generation_timeout
        messageKey:
          type: string
          description: Localized UI message identifier; never a raw provider error.
        retryable:
          type: boolean
