name: CI

# Runs the full quality gate on every PR to `main`/`develop` and on pushes to
# `main`. Mirrors the project's Definition of Done: format, lint, strict
# typecheck, unit tests with coverage gates, production build, Storybook/a11y,
# E2E, visual, and performance budgets. All browser tests use deterministic
# provider fakes (STORIES_TEST_MODE=fake) and never call a live AI service.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel in-flight runs when a newer run is triggered on the same branch.
# Reduces wasted CI minutes on force-pushes and follow-up commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # NOTE: STORIES_TEST_MODE is intentionally NOT set globally. The unit tests in
  # the quality job (e.g. tests/unit/env.test.ts) assert the env parser returns
  # exactly the configured fields, so a globally-injected provider selector would
  # break them. The fake provider is set only on the browser job, below.

jobs:
  quality:
    name: Quality gates (format, lint, typecheck, unit, coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage (≥80% overall; ≥90% safety/validation/orchestration)
        # vitest is configured to enforce these thresholds, so this fails CI
        # if the Gini targets (or the safety/validation/orchestration floor)
        # are not met.
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

  browser:
    name: Browser gates (${{ matrix.test }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deterministic provider for the browser/storybook/perf suites — no live AI.
    env:
      STORIES_TEST_MODE: "fake"
      # A full browser run fires many real POST /api/stories against one
      # shared server within a minute; raise the anonymous rate cap so tests
      # are not throttled (production still defaults to 10/min).
      STORY_RATE_LIMIT_MAX_REQUESTS: "10000"

    strategy:
      matrix:
        test: [storybook, e2e, visual, performance]
      fail-fast: false # Don't cancel other tests if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache Playwright binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Chromium + native deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production server
        # Playwright boots via `next start`, which serves a prebuilt `.next`;
        # jobs do not share a filesystem, so each browser job builds it.
        run: pnpm build

      - name: Run storybook tests
        if: matrix.test == 'storybook'
        id: test-storybook
        run: pnpm storybook:test

      - name: Run ${{ matrix.test }} tests
        if: matrix.test != 'storybook'
        id: test-playwright
        run: pnpm test:${{ matrix.test }}

      - name: Archive test output on failure (${{ matrix.test }})
        if: failure()
        continue-on-error: true # never mask the original test failure
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.test }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Summary job to gate PR merges. Must pass after all parallel browser tests.
  verify:
    name: Verify all checks passed
    needs: [quality, browser]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.quality.result }}" == "failure" ]]; then
            echo "❌ Quality gates failed"
            exit 1
          fi
          if [[ "${{ needs.browser.result }}" == "failure" ]]; then
            echo "❌ Browser tests failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
