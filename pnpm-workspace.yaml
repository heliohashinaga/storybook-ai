allowBuilds:
  '@clerk/shared': set this to true or false
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  msw: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - icu-minify@4.13.5
  - next-intl-swc-plugin-extractor@4.13.5
  - next-intl@4.13.5
  - use-intl@4.13.5

overrides:
  # fix(ci): pin jest 30.4.x — jest-runtime >=30.5 throws on storybook's
  # node:module register() TypeScript-loader hook used by @storybook/test-runner
  # getTestRunnerConfig -> serverRequire, failing every story suite with
  # 'module.register() is not supported in Jest'. @storybook/test-runner@0.26.0
  # accepts jest ^30.0.4, so 30.4.2 stays in range; the rest of the 30.4.x set is
  # pinned together to keep jest's internal packages on one version.
  jest: 30.4.2
  jest-circus: 30.4.2
  jest-runner: 30.4.2
  jest-environment-node: 30.4.1
  "@jest/types": 30.4.1
  nanoid: 3.3.18
  uuid: 11.1.1
  fast-uri: 3.1.8
  qs: 6.16.0
  image-size: 2.0.4
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  "joi@17": 17.13.8
  "joi@18": 18.2.9

patchedDependencies:
  '@storybook/nextjs@10.5.10': patches/@storybook__nextjs@10.5.10.patch
